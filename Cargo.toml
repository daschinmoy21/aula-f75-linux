[package]
name = "aula-f75"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
env_logger = "0.11.8"
hidapi = "2.6.4"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }

toml = "0.9.10"
gpui = { version = "0.2.2", optional = true }

[features]
gui = ["dep:gpui"]

[[bin]]
name = "aula-f75-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

# xattr 0.2.3 (via gpui -> zed-async-tar) uses libc::ENOATTR, which libc no longer exports on Linux.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
